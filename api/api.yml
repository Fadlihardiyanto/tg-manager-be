openapi: 3.0.3
info:
  title: Telegram Management API
  description: API documentation for Telegram Management Application (Admin, Tenant, and Public API)
  version: 1.0.0
  contact:
    name: Backend Team
servers:
  - url: http://localhost:8080
    description: Local Development Server
  - url: https://api.yourdomain.com
    description: Production Server

tags:
  - name: Public API
    description: Endpoints for public access and webhooks
  - name: Admin - Auth
    description: Admin authentication endpoints
  - name: Admin - Roles & Permissions
    description: Role-Based Access Control for Admin
  - name: Admin - Users
    description: Admin user management
  - name: Admin - Clients
    description: Client (Tenant) management by Admin
  - name: Admin - Billing & Plans
    description: Platform subscription plans and billing management
  - name: Tenant - Auth
    description: Tenant authentication and onboarding
  - name: Tenant - Bots
    description: Telegram bot management
  - name: Tenant - Groups
    description: Telegram group management
  - name: Tenant - Packages & Discounts
    description: Subscription packages for group members
  - name: Tenant - Billing
    description: Self-service billing for tenants

paths:
  # ==========================================
  # PUBLIC ROUTES
  # ==========================================
  /api/v1/public/plans:
    get:
      tags:
        - Public API
      summary: Get Public Plans
      description: Returns a list of active platform plans intended for the public landing page. No authentication required.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: "#/components/schemas/Meta"
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PlatformPlanResponse"

  /api/v1/member/checkout:
    post:
      tags:
        - Public API
      summary: Member Checkout
      description: Public endpoint for member checkout process
      responses:
        "200":
          description: Successful checkout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /webhooks/telegram/{bot_id}:
    post:
      tags:
        - Public API
      summary: Telegram Webhook
      description: Receives updates from Telegram Bot API
      parameters:
        - name: bot_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK

  /webhooks/midtrans/billing:
    post:
      tags:
        - Public API
      summary: Midtrans Billing Webhook
      description: Webhook for tenant billing payment status updates
      responses:
        "200":
          description: OK

  /webhooks/midtrans/member:
    post:
      tags:
        - Public API
      summary: Midtrans Member Webhook
      description: Webhook for member payment status updates
      responses:
        "200":
          description: OK

  # ==========================================
  # ADMIN ROUTES
  # ==========================================
  /admin/v1/auth/login:
    post:
      tags:
        - Admin - Auth
      summary: Admin Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"

  /admin/v1/roles:
    get:
      tags:
        - Admin - Roles & Permissions
      summary: List Admin Roles
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of roles
    post:
      tags:
        - Admin - Roles & Permissions
      summary: Create Admin Role
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Role created

  /admin/v1/admins:
    get:
      tags:
        - Admin - Users
      summary: List Admins
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of admins
    post:
      tags:
        - Admin - Users
      summary: Create Admin
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Admin created

  /admin/v1/clients:
    get:
      tags:
        - Admin - Clients
      summary: List Clients (Tenants)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of clients
    post:
      tags:
        - Admin - Clients
      summary: Create Client (Tenant)
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Client created

  /admin/v1/billing/plans:
    get:
      tags:
        - Admin - Billing & Plans
      summary: List Platform Plans
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of platform plans
    post:
      tags:
        - Admin - Billing & Plans
      summary: Create Platform Plan
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePlatformPlanRequest"
      responses:
        "201":
          description: Platform plan created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PlatformPlanResponse"

  /admin/v1/billing/plans/{id}:
    get:
      tags:
        - Admin - Billing & Plans
      summary: Get Platform Plan by ID
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Platform plan details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PlatformPlanResponse"
    put:
      tags:
        - Admin - Billing & Plans
      summary: Update Platform Plan
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePlatformPlanRequest"
      responses:
        "200":
          description: Platform plan updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PlatformPlanResponse"
    delete:
      tags:
        - Admin - Billing & Plans
      summary: Delete Platform Plan
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Platform plan deleted

  # ==========================================
  # TENANT ROUTES
  # ==========================================
  /api/v1/auth/register:
    post:
      tags:
        - Tenant - Auth
      summary: Tenant Registration
      description: Register a new user account. Business setup is done via onboarding.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantRegisterRequest"
      responses:
        "201":
          description: Registration successful, please check email for verification
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/TenantRegisterResponse"
        "400":
          description: Invalid request format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict - Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: "Email sudah terdaftar"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/auth/login:
    post:
      tags:
        - Tenant - Auth
      summary: Tenant Login
      description: Authenticate a user and return tokens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantLoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/TenantLoginResponse"
        "400":
          description: Invalid request format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/auth/verify-email:
    get:
      tags:
        - Tenant - Auth
      summary: Verify Email
      description: Verify email using the token sent to user's email. After successful verification, auto-logs the user in and returns JWT tokens.
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
          description: The verification token
      responses:
        "200":
          description: Email verified successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/TenantLoginResponse"
        "400":
          description: Token missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/auth/resend-verification:
    post:
      tags:
        - Tenant - Auth
      summary: Resend Verification Email
      description: Resends the email verification link to the user's email address. Returns success even if email is not found (to prevent enumeration).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantResendVerificationRequest"
      responses:
        "200":
          description: Verification email sent (or email not found - returns same response)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        type: string
                        example: "Link verifikasi telah dikirim ulang ke email Anda"
        "400":
          description: Email already verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: "Email sudah diverifikasi"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/clients/onboarding:
    post:
      tags:
        - Tenant - Auth
      summary: Tenant Onboarding
      security:
        - bearerAuth: []
      description: Create a client profile after registration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantOnboardingRequest"
      responses:
        "200":
          description: Onboarding complete, returns new tokens
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/TenantOnboardingResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/tenant/bots:
    get:
      tags:
        - Tenant - Bots
      summary: List Bots
      description: Retrieve a list of all Telegram bots associated with the tenant.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of bots
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/TelegramBotResponse"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - Requires bots.read permission

    post:
      tags:
        - Tenant - Bots
      summary: Create Bot
      description: Register a new Telegram bot using its token.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramBotCreateRequest"
      responses:
        "201":
          description: Bot created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/TelegramBotResponse"
        "400":
          description: Invalid request or bot token
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - Requires bots.create permission

  /api/v1/tenant/bots/{id}:
    get:
      tags:
        - Tenant - Bots
      summary: Get Bot Details
      description: Retrieve details of a specific bot.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Bot details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/TelegramBotResponse"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - Requires bots.read permission
        "404":
          description: Bot not found

    put:
      tags:
        - Tenant - Bots
      summary: Update Bot
      description: Update an existing bot's details.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramBotUpdateRequest"
      responses:
        "200":
          description: Bot updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/TelegramBotResponse"
        "400":
          description: Invalid request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - Requires bots.update permission
        "404":
          description: Bot not found

    delete:
      tags:
        - Tenant - Bots
      summary: Delete Bot
      description: Remove a bot from the tenant.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Bot deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - Requires bots.delete permission
        "404":
          description: Bot not found

  /api/v1/tenant/commands:
    get:
      tags:
        - Tenant - Custom Commands
      summary: List Custom Commands
      description: Retrieve a list of all custom commands with optional filtering.
      security:
        - bearerAuth: []
      parameters:
        - name: bot_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: is_active
          in: query
          required: false
          schema:
            type: boolean
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: List of custom commands
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/CustomCommandResponse"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - Requires bots.read permission

    post:
      tags:
        - Tenant - Custom Commands
      summary: Create Custom Command
      description: Create a new custom command trigger for a bot.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCustomCommandRequest"
      responses:
        "201":
          description: Command created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CustomCommandResponse"
        "400":
          description: Invalid request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - Requires bots.create permission

  /api/v1/tenant/commands/{id}:
    get:
      tags:
        - Tenant - Custom Commands
      summary: Get Custom Command Details
      description: Retrieve details of a specific custom command.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Custom command details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CustomCommandResponse"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - Requires bots.read permission
        "404":
          description: Command not found

    put:
      tags:
        - Tenant - Custom Commands
      summary: Update Custom Command
      description: Update an existing custom command's details.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCustomCommandRequest"
      responses:
        "200":
          description: Command updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CustomCommandResponse"
        "400":
          description: Invalid request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - Requires bots.update permission
        "404":
          description: Command not found

    delete:
      tags:
        - Tenant - Custom Commands
      summary: Delete Custom Command
      description: Remove a custom command from the bot.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Command deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - Requires bots.delete permission
        "404":
          description: Command not found

  /api/v1/tenant/groups:
    get:
      tags:
        - Tenant - Groups
      summary: List Groups
      description: Retrieve a list of all Telegram groups managed by the tenant.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of groups
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/GroupResponse"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - Requires groups.read permission

    post:
      tags:
        - Tenant - Groups
      summary: Create Group
      description: Register a new Telegram group manually by its Chat ID.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupCreateRequest"
      responses:
        "201":
          description: Group created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/GroupResponse"
        "400":
          description: Invalid request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - Requires groups.create permission

  /api/v1/tenant/groups/{id}:
    get:
      tags:
        - Tenant - Groups
      summary: Get Group Details
      description: Retrieve details of a specific Telegram group.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Group details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/GroupResponse"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - Requires groups.read permission
        "404":
          description: Group not found

    put:
      tags:
        - Tenant - Groups
      summary: Update Group
      description: Update an existing group's details.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupUpdateRequest"
      responses:
        "200":
          description: Group updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/GroupResponse"
        "400":
          description: Invalid request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - Requires groups.update permission
        "404":
          description: Group not found

    delete:
      tags:
        - Tenant - Groups
      summary: Delete Group
      description: Remove a group from the tenant's management.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Group deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - Requires groups.delete permission
        "404":
          description: Group not found

  /api/v1/tenant/packages:
    get:
      tags:
        - Tenant - Packages & Discounts
      summary: List Packages
      description: Retrieve a list of all subscription packages created by the tenant.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of packages
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/PackageResponse"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - Requires packages.read permission

    post:
      tags:
        - Tenant - Packages & Discounts
      summary: Create Package
      description: Create a new subscription package for group access.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PackageCreateRequest"
      responses:
        "201":
          description: Package created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PackageResponse"
        "400":
          description: Invalid request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - Requires packages.create permission

  /api/v1/tenant/packages/{id}:
    get:
      tags:
        - Tenant - Packages & Discounts
      summary: Get Package Details
      description: Retrieve details of a specific package.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
