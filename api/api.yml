components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Include 'Bearer {token}' in the Authorization header

  schemas:
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        code:
          type: integer
          example: 200
        message:
          type: string
          example: Request successful
        data:
          type: object
        request_id:
          type: string
          example: "req-12345"

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        code:
          type: integer
          example: 400
        message:
          type: string
          example: Error message details
        errors:
          type: object
          description: Detailed validation errors if any
        request_id:
          type: string
          example: "req-12345"

    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer

    TenantRegisterRequest:
      type: object
      required:
        - name
        - email
        - password
        - confirm_password
      properties:
        name:
          type: string
          example: "John Doe"
          minLength: 3
        email:
          type: string
          format: email
          example: "john@example.com"
        password:
          type: string
          format: password
          example: "SecretPassword123"
          minLength: 8
        confirm_password:
          type: string
          format: password
          example: "SecretPassword123"

    TenantRegisterResponse:
      type: object
      properties:
        user:
          type: object
          description: Basic user information
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            email:
              type: string
            phone:
              type: string

    TenantLoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: "john@example.com"
        password:
          type: string
          format: password
          example: "SecretPassword123"

    TenantResendVerificationRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: "john@example.com"

    TenantLoginResponse:
      type: object
      properties:
        access_token:
          type: string
          example: "eyJhbGci..."
        refresh_token:
          type: string
          example: "eyJhbGci..."
        expires_in:
          type: integer
          example: 3600
        user:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            email:
              type: string
            phone:
              type: string
        client:
          type: object
          nullable: true
          properties:
            id:
              type: string
              format: uuid
            business_name:
              type: string
            business_slug:
              type: string
        role:
          type: string
          example: "owner"
        needs_onboarding:
          type: boolean
          example: false

    TenantOnboardingRequest:
      type: object
      required:
        - business_name
        - business_slug
        - category
      properties:
        business_name:
          type: string
          example: "My Telegram Store"
        business_slug:
          type: string
          example: "my-store"
        category:
          type: string
          example: "Retail"

    TenantOnboardingResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
        user:
          type: object
          properties:
            id:
              type: string
              format: uuid
        client:
          type: object
          properties:
            id:
              type: string
              format: uuid
            business_name:
              type: string
            business_slug:
              type: string
        role:
          type: string
          example: "owner"



    TelegramBotCreateRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          description: "Telegram Bot Token from BotFather"
          example: "123456789:ABCdefGHIjklMNOpqrSTUvwxYZ"
        bot_role:
          type: string
          enum: [sales_only, gatekeeper_only, all_in_one]
          example: "all_in_one"

