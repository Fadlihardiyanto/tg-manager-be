          example: 123456789
        username:
          type: string
          example: "MySuperBot"
        bot_role:
          type: string
          example: "all_in_one"
        is_active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

